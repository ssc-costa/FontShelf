name: Build FontShelf for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test and package Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        run: pnpm test
      - name: Check translations
        run: pnpm i18n:check
      - name: Install browser for interface tests
        run: pnpm exec playwright install chromium
      - name: Interface tests
        run: pnpm test:ui
      - name: Upload interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FontShelf-interface-tests
          path: |
            test-results/
            playwright-report/
          retention-days: 14
      - name: Native tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis,msi
      - name: Package standalone app
        shell: pwsh
        run: |
          $root = "portable/FontShelf"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "src-tauri/target/release/zfontmanager.exe" "$root/FontShelf.exe"
          Copy-Item LICENSE "$root/LICENSE.txt"
          Copy-Item NOTICE.md "$root/NOTICE.md"
          Set-Content -Path "$root/portable.txt" -Encoding utf8 -Value "FontShelf stores its library settings in the data folder beside this file. Windows WebView2 Runtime must be installed."
          Compress-Archive -Path $root -DestinationPath "portable/FontShelf_0.1.0_x64-portable.zip" -Force
      - name: Upload installers and portable app
        uses: actions/upload-artifact@v4
        with:
          name: FontShelf-0.1.0-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            portable/*.zip
          if-no-files-found: error
          retention-days: 30
